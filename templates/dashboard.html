<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智慧农业实时监控大屏</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
  background: #0a1628;
  color: #e8f1ff;
  min-height: 100vh;
  padding: 20px;
}

/* Header */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 24px;
  background: linear-gradient(135deg, #1a2a4a 0%, #0d1b3a 100%);
  border-radius: 12px;
  margin-bottom: 20px;
  border: 1px solid rgba(64, 158, 255, 0.3);
}
.header h1 {
  font-size: 24px;
  font-weight: 600;
  background: linear-gradient(90deg, #409eff, #67c23a);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.header .status {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 14px;
  color: #67c23a;
}
.header .status::before {
  content: "";
  width: 10px;
  height: 10px;
  background: #67c23a;
  border-radius: 50%;
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}

/* Grid */
.grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  margin-bottom: 20px;
}

/* Card */
.card {
  background: linear-gradient(135deg, #1a2a4a 0%, #0d1b3a 100%);
  border-radius: 12px;
  padding: 20px;
  border: 1px solid rgba(64, 158, 255, 0.2);
  transition: transform 0.3s, box-shadow 0.3s;
}
.card:hover {
  transform: translateY(-4px);
  box-shadow: 0 8px 24px rgba(64, 158, 255, 0.2);
}
.card-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
}
.card-icon {
  width: 40px;
  height: 40px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
}
.card-icon.temp { background: rgba(245, 108, 108, 0.2); color: #f56c6c; }
.card-icon.humid { background: rgba(64, 158, 255, 0.2); color: #409eff; }
.card-icon.light { background: rgba(230, 162, 60, 0.2); color: #e6a23c; }
.card-icon.soil { background: rgba(103, 194, 58, 0.2); color: #67c23a; }
.card-title {
  font-size: 14px;
  color: #a8b2c8;
}
.card-value {
  font-size: 32px;
  font-weight: 700;
  color: #fff;
  margin: 8px 0;
}
.card-value .unit {
  font-size: 16px;
  color: #a8b2c8;
  margin-left: 4px;
}
.card-range {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: #a8b2c8;
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px solid rgba(255, 255, 255, 0.1);
}
.card-range .min { color: #67c23a; }
.card-range .max { color: #f56c6c; }

/* Chart area */
.chart-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-bottom: 20px;
}
.chart-card {
  background: linear-gradient(135deg, #1a2a4a 0%, #0d1b3a 100%);
  border-radius: 12px;
  padding: 20px;
  border: 1px solid rgba(64, 158, 255, 0.2);
}
.chart-card h3 {
  font-size: 16px;
  margin-bottom: 16px;
  color: #e8f1ff;
}
.trend-chart {
  width: 100%;
  height: 240px;
}
.chart-row {
  display: grid;
  grid-template-columns: 1fr;
  gap: 16px;
}
#alert-list {
  list-style: none;
  max-height: 200px;
  overflow-y: auto;
}
#alert-list li {
  padding: 12px;
  margin-bottom: 8px;
  background: rgba(245, 108, 108, 0.1);
  border-left: 3px solid #f56c6c;
  border-radius: 4px;
  font-size: 13px;
}
#alert-list li.info {
  background: rgba(64, 158, 255, 0.1);
  border-left-color: #409eff;
}

/* Responsive */
@media (max-width: 1200px) {
  .grid { grid-template-columns: repeat(2, 1fr); }
  .chart-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div class="header">
  <h1>🌾 智慧农业实时监控大屏</h1>
  <div class="status">系统运行中 · 实时数据</div>
</div>

<div class="grid">
  <div class="card">
    <div class="card-header">
      <div class="card-icon temp">🌡️</div>
      <div class="card-title">平均温度</div>
    </div>
    <div class="card-value"><span id="avg-temp">--</span><span class="unit">°C</span></div>
    <div class="card-range">
      <span>最低: <span class="min" id="min-temp">--</span>°C</span>
      <span>最高: <span class="max" id="max-temp">--</span>°C</span>
    </div>
  </div>

  <div class="card">
    <div class="card-header">
      <div class="card-icon humid">💧</div>
      <div class="card-title">平均湿度</div>
    </div>
    <div class="card-value"><span id="avg-humid">--</span><span class="unit">%</span></div>
    <div class="card-range">
      <span>最低: <span class="min" id="min-humid">--</span>%</span>
      <span>最高: <span class="max" id="max-humid">--</span>%</span>
    </div>
  </div>

  <div class="card">
    <div class="card-header">
      <div class="card-icon light">☀️</div>
      <div class="card-title">光照强度</div>
    </div>
    <div class="card-value"><span id="light">--</span><span class="unit">lux</span></div>
    <div class="card-range">
      <span>当前光照正常</span>
      <span>适宜: 2000-5000</span>
    </div>
  </div>

  <div class="card">
    <div class="card-header">
      <div class="card-icon soil">🌱</div>
      <div class="card-title">土壤湿度</div>
    </div>
    <div class="card-value"><span id="soil">--</span><span class="unit">%</span></div>
    <div class="card-range">
      <span>当前水分充足</span>
      <span>适宜: 40-60%</span>
    </div>
  </div>
</div>

<div class="chart-grid">
  <div class="chart-card">
    <h3>🌡️ 温度趋势 (近10个窗口)</h3>
    <div class="trend-chart" id="chart-temp"></div>
  </div>
  <div class="chart-card">
    <h3>💧 湿度趋势 (近10个窗口)</h3>
    <div class="trend-chart" id="chart-hum"></div>
  </div>
  <div class="chart-card">
    <h3>🌱 土壤湿度趋势 (近10个窗口)</h3>
    <div class="trend-chart" id="chart-soil"></div>
  </div>
  <div class="chart-card">
    <h3>☀️ 光照强度趋势 (近10个窗口)</h3>
    <div class="trend-chart" id="chart-light"></div>
  </div>
</div>

<div class="chart-row">
  <div class="chart-card">
    <h3>⚠️ 实时告警</h3>
    <ul id="alert-list">
      <li class="info">系统启动中,等待数据...</li>
    </ul>
  </div>
</div>

<script>
// ---------- 四个趋势图 (不同颜色) ----------
function makeChart(domId, name, unit, color) {
  const c = echarts.init(document.getElementById(domId));
  c.setOption({
    backgroundColor: 'transparent',
    tooltip: { trigger: 'axis' },
    grid: { left: '12%', right: '5%', top: '12%', bottom: '18%' },
    xAxis: {
      type: 'category',
      data: [],
      axisLine: { lineStyle: { color: '#4a5568' } },
      axisLabel: { color: '#a8b2c8', fontSize: 10, rotate: 30 },
    },
    yAxis: {
      type: 'value',
      name: unit,
      nameTextStyle: { color: '#a8b2c8' },
      axisLine: { lineStyle: { color: '#4a5568' } },
      axisLabel: { color: '#a8b2c8' },
      splitLine: { lineStyle: { color: 'rgba(255,255,255,0.05)' } },
      scale: true,
    },
    series: [{
      name: name,
      type: 'line',
      smooth: true,
      data: [],
      lineStyle: { width: 3, color: color },
      areaStyle: {
        color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
          { offset: 0, color: color + '66' },
          { offset: 1, color: color + '0d' },
        ]),
      },
      itemStyle: { color: color },
    }],
  });
  return c;
}

const chartTemp  = makeChart('chart-temp',  '平均温度',   '°C',  '#f56c6c'); // 红
const chartHum   = makeChart('chart-hum',   '平均湿度',   '%',   '#409eff'); // 蓝
const chartSoil  = makeChart('chart-soil',  '平均土壤湿度', '%', '#67c23a'); // 绿
const chartLight = makeChart('chart-light', '平均光照',   'lux', '#e6a23c'); // 橙

// History buffer (四项共用时间轴)
const history = [];
const MAX_POINTS = 10;

function pushChart(chart, values) {
  chart.setOption({
    xAxis: { data: history.map(h => h.time) },
    series: [{ data: values }],
  });
}

// Poll
async function refresh() {
  try {
    const resp = await fetch('/api/latest');
    const data = await resp.json();
    if (data.status === 'ok') {
      document.getElementById('avg-temp').textContent = data.avg_temp.toFixed(1);
      document.getElementById('min-temp').textContent = data.min_temp.toFixed(1);
      document.getElementById('max-temp').textContent = data.max_temp.toFixed(1);

      // 湿度/土壤/光照: 用 Spark 真实聚合值, 旧格式没有时显示 --
      const hasAll = data.avg_hum !== undefined;
      document.getElementById('avg-humid').textContent = hasAll ? data.avg_hum.toFixed(1) : '--';
      document.getElementById('soil').textContent      = hasAll ? data.avg_soil.toFixed(1) : '--';
      document.getElementById('light').textContent     = hasAll ? Math.round(data.avg_light) : '--';

      // Update charts
      const time = new Date(data.window_end).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      history.push({
        time,
        temp: +data.avg_temp.toFixed(2),
        hum: hasAll ? +data.avg_hum.toFixed(2) : null,
        soil: hasAll ? +data.avg_soil.toFixed(2) : null,
        light: hasAll ? +data.avg_light.toFixed(0) : null,
      });
      if (history.length > MAX_POINTS) history.shift();

      pushChart(chartTemp,  history.map(h => h.temp));
      pushChart(chartHum,   history.map(h => h.hum));
      pushChart(chartSoil,  history.map(h => h.soil));
      pushChart(chartLight, history.map(h => h.light));

      // Update alerts
      const alerts = document.getElementById('alert-list');
      alerts.innerHTML = '';
      if (data.avg_temp > 28) {
        alerts.innerHTML += '<li>⚠️ 温度过高 (' + data.avg_temp.toFixed(1) + '°C),建议开启通风</li>';
      } else if (data.avg_temp < 15) {
        alerts.innerHTML += '<li>⚠️ 温度过低 (' + data.avg_temp.toFixed(1) + '°C),建议保温</li>';
      }
      if (hasAll) {
        if (data.avg_hum > 85) alerts.innerHTML += '<li>⚠️ 湿度过高 (' + data.avg_hum.toFixed(1) + '%),注意病害风险</li>';
        if (data.avg_soil < 30) alerts.innerHTML += '<li>⚠️ 土壤偏干 (' + data.avg_soil.toFixed(1) + '%),建议灌溉</li>';
      }
      if (!alerts.innerHTML) {
        alerts.innerHTML += '<li class="info">✅ 当前环境正常,无告警</li>';
      }
      alerts.innerHTML += '<li class="info">💡 最近窗口: ' + time + '</li>';
    } else {
      document.getElementById('avg-temp').textContent = '...';
    }
  } catch (e) {
    console.error(e);
  }
}

refresh();
setInterval(refresh, 2000);
window.addEventListener('resize', () => {
  chartTemp.resize(); chartHum.resize(); chartSoil.resize(); chartLight.resize();
});
</script>

</body>
</html>
