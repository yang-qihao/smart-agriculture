<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智慧农业实时监控大屏</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
  background: #0a1628;
  color: #e8f1ff;
  min-height: 100vh;
  padding: 20px;
}

/* Header */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 24px;
  background: linear-gradient(135deg, #1a2a4a 0%, #0d1b3a 100%);
  border-radius: 12px;
  margin-bottom: 20px;
  border: 1px solid rgba(64, 158, 255, 0.3);
}
.header h1 {
  font-size: 24px;
  font-weight: 600;
  background: linear-gradient(90deg, #409eff, #67c23a);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.header .status {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 14px;
  color: #67c23a;
}
.header .status::before {
  content: "";
  width: 10px;
  height: 10px;
  background: #67c23a;
  border-radius: 50%;
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}

/* Grid */
.grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  margin-bottom: 20px;
}

/* Card */
.card {
  background: linear-gradient(135deg, #1a2a4a 0%, #0d1b3a 100%);
  border-radius: 12px;
  padding: 20px;
  border: 1px solid rgba(64, 158, 255, 0.2);
  transition: transform 0.3s, box-shadow 0.3s;
}
.card:hover {
  transform: translateY(-4px);
  box-shadow: 0 8px 24px rgba(64, 158, 255, 0.2);
}
.card-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
}
.card-icon {
  width: 40px;
  height: 40px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
}
.card-icon.temp { background: rgba(245, 108, 108, 0.2); color: #f56c6c; }
.card-icon.humid { background: rgba(64, 158, 255, 0.2); color: #409eff; }
.card-icon.light { background: rgba(230, 162, 60, 0.2); color: #e6a23c; }
.card-icon.soil { background: rgba(103, 194, 58, 0.2); color: #67c23a; }
.card-title {
  font-size: 14px;
  color: #a8b2c8;
}
.card-value {
  font-size: 32px;
  font-weight: 700;
  color: #fff;
  margin: 8px 0;
}
.card-value .unit {
  font-size: 16px;
  color: #a8b2c8;
  margin-left: 4px;
}
.card-range {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: #a8b2c8;
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px solid rgba(255, 255, 255, 0.1);
}
.card-range .min { color: #67c23a; }
.card-range .max { color: #f56c6c; }

/* Chart area */
.chart-row {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 16px;
}
.chart-card {
  background: linear-gradient(135deg, #1a2a4a 0%, #0d1b3a 100%);
  border-radius: 12px;
  padding: 20px;
  border: 1px solid rgba(64, 158, 255, 0.2);
}
.chart-card h3 {
  font-size: 16px;
  margin-bottom: 16px;
  color: #e8f1ff;
}
#trend-chart {
  width: 100%;
  height: 300px;
}
#alert-list {
  list-style: none;
  max-height: 300px;
  overflow-y: auto;
}
#alert-list li {
  padding: 12px;
  margin-bottom: 8px;
  background: rgba(245, 108, 108, 0.1);
  border-left: 3px solid #f56c6c;
  border-radius: 4px;
  font-size: 13px;
}
#alert-list li.info {
  background: rgba(64, 158, 255, 0.1);
  border-left-color: #409eff;
}

/* Responsive */
@media (max-width: 1200px) {
  .grid { grid-template-columns: repeat(2, 1fr); }
  .chart-row { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div class="header">
  <h1>🌾 智慧农业实时监控大屏</h1>
  <div class="status">系统运行中 · 实时数据</div>
</div>

<div class="grid">
  <div class="card">
    <div class="card-header">
      <div class="card-icon temp">🌡️</div>
      <div class="card-title">平均温度</div>
    </div>
    <div class="card-value"><span id="avg-temp">--</span><span class="unit">°C</span></div>
    <div class="card-range">
      <span>最低: <span class="min" id="min-temp">--</span>°C</span>
      <span>最高: <span class="max" id="max-temp">--</span>°C</span>
    </div>
  </div>

  <div class="card">
    <div class="card-header">
      <div class="card-icon humid">💧</div>
      <div class="card-title">平均湿度</div>
    </div>
    <div class="card-value"><span id="avg-humid">--</span><span class="unit">%</span></div>
    <div class="card-range">
      <span>最低: <span class="min" id="min-humid">--</span>%</span>
      <span>最高: <span class="max" id="max-humid">--</span>%</span>
    </div>
  </div>

  <div class="card">
    <div class="card-header">
      <div class="card-icon light">☀️</div>
      <div class="card-title">光照强度</div>
    </div>
    <div class="card-value"><span id="light">--</span><span class="unit">lux</span></div>
    <div class="card-range">
      <span>当前光照正常</span>
      <span>适宜: 2000-5000</span>
    </div>
  </div>

  <div class="card">
    <div class="card-header">
      <div class="card-icon soil">🌱</div>
      <div class="card-title">土壤湿度</div>
    </div>
    <div class="card-value"><span id="soil">--</span><span class="unit">%</span></div>
    <div class="card-range">
      <span>当前水分充足</span>
      <span>适宜: 40-60%</span>
    </div>
  </div>
</div>

<div class="chart-row">
  <div class="chart-card">
    <h3>📈 温度趋势 (近10个窗口)</h3>
    <div id="trend-chart"></div>
  </div>
  <div class="chart-card">
    <h3>⚠️ 实时告警</h3>
    <ul id="alert-list">
      <li class="info">系统启动中,等待数据...</li>
    </ul>
  </div>
</div>

<script>
// ECharts init
const chart = echarts.init(document.getElementById('trend-chart'));
const chartOption = {
  backgroundColor: 'transparent',
  tooltip: { trigger: 'axis' },
  grid: { left: '8%', right: '4%', top: '10%', bottom: '15%' },
  xAxis: {
    type: 'category',
    data: [],
    axisLine: { lineStyle: { color: '#4a5568' } },
    axisLabel: { color: '#a8b2c8', fontSize: 11 },
  },
  yAxis: {
    type: 'value',
    name: '温度 (°C)',
    nameTextStyle: { color: '#a8b2c8' },
    axisLine: { lineStyle: { color: '#4a5568' } },
    axisLabel: { color: '#a8b2c8' },
    splitLine: { lineStyle: { color: 'rgba(255,255,255,0.05)' } },
  },
  series: [
    {
      name: '平均温度',
      type: 'line',
      smooth: true,
      data: [],
      lineStyle: { width: 3, color: '#f56c6c' },
      areaStyle: {
        color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
          { offset: 0, color: 'rgba(245, 108, 108, 0.4)' },
          { offset: 1, color: 'rgba(245, 108, 108, 0.05)' },
        ]),
      },
      itemStyle: { color: '#f56c6c' },
    },
  ],
};
chart.setOption(chartOption);

// History buffer
const history = [];
const MAX_POINTS = 10;

// Poll
async function refresh() {
  try {
    const resp = await fetch('/api/latest');
    const data = await resp.json();
    if (data.status === 'ok') {
      document.getElementById('avg-temp').textContent = data.avg_temp.toFixed(1);
      document.getElementById('min-temp').textContent = data.min_temp.toFixed(1);
      document.getElementById('max-temp').textContent = data.max_temp.toFixed(1);
      // Mock other sensors (real pipeline only has temp for now)
      document.getElementById('avg-humid').textContent = (55 + Math.random() * 10).toFixed(1);
      document.getElementById('light').textContent = Math.round(3000 + Math.random() * 1500);
      document.getElementById('soil').textContent = (45 + Math.random() * 8).toFixed(1);
      document.getElementById('min-humid').textContent = '42.3';
      document.getElementById('max-humid').textContent = '68.7';

      // Update chart
      const time = new Date(data.window_end).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      history.push({ time, temp: data.avg_temp });
      if (history.length > MAX_POINTS) history.shift();
      chart.setOption({
        xAxis: { data: history.map(h => h.time) },
        series: [{ data: history.map(h => h.temp) }],
      });

      // Update alerts
      const alerts = document.getElementById('alert-list');
      alerts.innerHTML = '';
      if (data.avg_temp > 28) {
        alerts.innerHTML += '<li>⚠️ 温度过高 (' + data.avg_temp.toFixed(1) + '°C),建议开启通风</li>';
      } else if (data.avg_temp < 15) {
        alerts.innerHTML += '<li>⚠️ 温度过低 (' + data.avg_temp.toFixed(1) + '°C),建议保温</li>';
      } else {
        alerts.innerHTML += '<li class="info">✅ 当前环境正常,无告警</li>';
      }
      alerts.innerHTML += '<li class="info">💡 最近窗口: ' + time + '</li>';
    } else {
      document.getElementById('avg-temp').textContent = '...';
    }
  } catch (e) {
    console.error(e);
  }
}

refresh();
setInterval(refresh, 2000);
window.addEventListener('resize', () => chart.resize());
</script>

</body>
</html>
