<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Socket.IO 推送演示</title>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<style>
  body { font-family:"Microsoft YaHei",sans-serif; max-width:760px; margin:30px auto; padding:0 16px; background:#0b1526; color:#e8f1ff; }
  h1 { font-size:20px; }
  .row { display:flex; gap:16px; flex-wrap:wrap; margin:20px 0; }
  .c { background:#132238; border:1px solid #1f3a5c; border-radius:10px; padding:16px 26px; text-align:center; min-width:120px; }
  .v { font-size:30px; font-weight:bold; color:#4fc3f7; font-family:Consolas,monospace; }
  .t { color:#8aa5c0; font-size:12px; margin-top:6px; }
  #log { background:#000; color:#7ec69a; font-family:Consolas,monospace; font-size:12px; padding:10px; border-radius:8px; height:160px; overflow-y:auto; }
  #st { color:#7fd0a0; font-size:13px; }
</style>
</head>
<body>
<h1>Socket.IO 推送演示 <span id="st">(连接中…)</span></h1>
<p style="color:#8aa5c0;font-size:13px">数值每 2 秒被服务器<b>主动推</b>下来 —— 没有一问一答, 这就是 WebSocket 推送。</p>
<div class="row">
  <div class="c"><div class="v" id="tem">--</div><div class="t">温度 ℃</div></div>
  <div class="c"><div class="v" id="hum">--</div><div class="t">湿度 %</div></div>
  <div class="c"><div class="v" id="soil">--</div><div class="t">土壤湿度 %</div></div>
  <div class="c"><div class="v" id="light">--</div><div class="t">光照 lx</div></div>
</div>
<div id="log"></div>
<script>
const s = io();
const log = document.getElementById('log');
s.on('connect', () => document.getElementById('st').textContent = '(已连接 ✓)');
s.on('disconnect', () => document.getElementById('st').textContent = '(断开)');
s.on('sensor_update', d => {
  tem.textContent = d.tem; hum.textContent = d.hum;
  soil.textContent = d.soil_hum; light.textContent = d.light_inten;
  const line = document.createElement('div');
  line.textContent = d.time_stamp + '  ' + JSON.stringify(d);
  log.prepend(line);
  while (log.children.length > 8) log.lastChild.remove();
});
</script>
</body>
</html>
